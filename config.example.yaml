# Template de exemplo de configuração para GPU Hunter
# Copie para config.yaml se desejar restaurar os valores padrão
hardware:
  brand: "nvidia"
  min_vram_gb: 16
  max_vram_gb: 32
  max_price_brl: 5000.0
  min_price_brl: 150.0

location:
  center_city: "Veranópolis"
  state: "RS"
  latitude: -28.9358
  longitude: -51.5503
  radius_km: 40
  target_cities:
    - "Veranópolis"
    - "Bento Gonçalves"
    - "Nova Prata"
    - "Cotiporã"
    - "Vila Flores"
    - "Fagundes Varela"
    - "Garibaldi"
    - "Carlos Barbosa"
    - "Guaporé"
    - "Farroupilha"

defect_detection:
  keywords:
    - "com defeito"
    - "para conserto"
    - "para peças"
    - "para pecas"
    - "retirada de peças"
    - "não dá vídeo"
    - "nao da video"
    - "sem vídeo"
    - "queimada"
    - "sucata"
    - "tela preta"
    - "dando artefato"
    - "artefato"
    - "precisa de reparo"
    - "no estado"

scrapers:
  olx:
    enabled: true
    state_code: "rs"
  facebook:
    enabled: true
    headless: true
    email: ""
    password: ""
    session_file: "data/fb_session.json"

national_benchmark:
  enabled: true
  cache_ttl_hours: 24

server:
  host: "0.0.0.0"
  port: 7860
